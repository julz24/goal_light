name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update manifest version
        run: |
          sed -i 's/"version": ".*"/"version": "${{ steps.version.outputs.VERSION }}"/' \
            custom_components/goal_light/manifest.json

      - name: Create release zip
        run: |
          zip -r goal_light.zip custom_components/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Goal Light ${{ github.ref_name }}"
          body: |
            ## Goal Light ${{ github.ref_name }}

            ### Installation via HACS
            1. HACS → Intégrations → ⋮ → Dépôts personnalisés
            2. URL : `https://github.com/VOTRE_USER/goal_light`  
            3. Catégorie : **Intégration**
            4. Installer **Goal Light**
            5. Redémarrer Home Assistant

            ### Installation manuelle
            Télécharger `goal_light.zip`, extraire dans `config/custom_components/`.
          files: goal_light.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
