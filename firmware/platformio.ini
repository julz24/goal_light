[env:esp32-c3-supermini]
; Version fixée (core Arduino 3.3.12) pour des builds reproductibles
platform                  = espressif32 @ 8.0.0
board                     = esp32-c3-devkitm-1
framework                 = arduino

; Réglages board (identiques à Arduino IDE)
board_build.flash_size    = 4MB
; 1,9 Mo par application + OTA (au lieu de 1,25 Mo) — NVS à la même adresse (0x9000)
; = Arduino IDE : Partition Scheme « Minimal SPIFFS (1.9MB APP with OTA/190KB SPIFFS) »
board_build.partitions    = min_spiffs.csv
board_build.f_cpu         = 160000000L
; ESP32-C3 : USB série intégré (HWCDC), pas d'USB OTG -> ARDUINO_USB_MODE=1 obligatoire
build_flags               =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; Librairies
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    bblanchon/ArduinoJson      @ ^7.3.1
    tzapu/WiFiManager          @ ^2.0.17
    ayushsharma82/ElegantOTA   @ ^3.1.6

monitor_speed = 115200
upload_speed  = 921600
